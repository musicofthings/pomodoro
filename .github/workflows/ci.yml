name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Validate Android
        working-directory: CozyFocusAndroid
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin lintDebug assembleDebug bundleRelease --no-daemon

  ios:
    runs-on: macos-26
    steps:
      - name: Check out sources
        uses: actions/checkout@v6
      - name: Build and test iOS
        run: >-
          xcodebuild test
          -project CozyFocus.xcodeproj
          -scheme CozyFocus
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -derivedDataPath "$RUNNER_TEMP/cozyfocus-derived"
          CODE_SIGNING_ALLOWED=NO
          CODE_SIGNING_REQUIRED=NO
